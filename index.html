<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Screen Capture Test</title>
</head>
<body>
    <h2>Screen Capture to Telegram Test</h2>
    <button id="captureBtn">Take Screenshot & Send</button>
    <p id="status"></p>

    <script>
        const BOT_TOKEN = "9272226304:AAFQZoMFZaiEhc56u3MfLJughNliVGEdgOo";
        const CHAT_ID = "6754488795";

        document.getElementById('captureBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('status');
            try {
                statusEl.innerText = "Requesting screen access...";
                
                // 1. පරිශීලකයාගේ තිරය ලබා ගැනීමට ඉල්ලීම (මෙතැනදී Pop-up එකක් එයි)
                const mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" }
                });

                statusEl.innerText = "Capturing frame...";
                
                // 2. Video element එකක් හරහා Frame එකක් Canvas එකකට ලබා ගැනීම
                const video = document.createElement('video');
                video.srcObject = mediaStream;
                await video.play();

                // තත්පරයක් ඉඳලා වීඩියෝ එක රෙන්ඩර් වෙන්න ඉඩ හරින්න
                await new Promise(resolve => setTimeout(resolve, 1000));

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Media stream එක නවතා දැමීම (ਕැමරා/ਸਕ੍ਰੀਨ ਸ਼ੇਅਰਿੰਗ අයිකන් එක නැති වීමට)
                mediaStream.getTracks().forEach(track => track.stop());

                statusEl.innerText = "Converting to image...";

                // 3. Canvas එක Blob එකකට (Image file) හැරවීම
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        statusEl.innerText = "Failed to create image blob.";
                        return;
                    }

                    statusEl.innerText = "Sending to Telegram...";

                    // 4. Telegram Bot API එකට ඩටා යැවීම
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'screenshot.png');

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    if (result.ok) {
                        statusEl.innerText = "Screenshot sent successfully to Telegram!";
                    } else {
                        statusEl.innerText = "Failed: " + (result.description || "Unknown error");
                    }
                }, 'image/png');

            } catch (err) {
                console.error(err);
                statusEl.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
