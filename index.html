<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera to Telegram</title>
</head>
<body>
    <h2>Mobile Camera Capture Test</h2>
    <video id="video" width="100%" autoplay playsinline></video>
    <button id="captureBtn">Take Photo & Send</button>
    <p id="status"></p>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "9272226304:AAFQZoMFZaiEhc56u3MfLJughNliVGEdgOo";
        const CHAT_ID = "6754488795";

        const video = document.getElementById('video');
        const statusEl = document.getElementById('status');

        // දුරකථන කැමරාව ઓપන් කරගැනීම
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                statusEl.innerText = "Camera Error: " + err.message;
            });

        document.getElementById('captureBtn').addEventListener('click', async () => {
            statusEl.innerText = "Capturing photo...";
            
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                if (!blob) {
                    statusEl.innerText = "Failed to capture image.";
                    return;
                }

                statusEl.innerText = "Sending to Telegram...";

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'photo.jpg');

                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                if (result.ok) {
                    statusEl.innerText = "Photo sent successfully!";
                } else {
                    statusEl.innerText = "Failed: " + (result.description || "Unknown error");
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
